<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(80, 118)">
    <rect width="72" height="72" rx="18" fill="url(#accent)"/>
    <!-- play triangle morphing into text lines -->
    <path d="M24 22 L40 30 L24 38 Z" fill="#0d1117"/>
    <rect x="24" y="42" width="26" height="4" rx="2" fill="#0d1117"/>
    <rect x="24" y="50" width="18" height="4" rx="2" fill="#0d1117"/>
  </g>

  <!-- title block -->
  <text x="80" y="268" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="60" font-weight="700" fill="#e6edf3">oil-video-article</text>
  <text x="80" y="326" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="30" font-weight="600" fill="url(#accent)">视频 → 公众号图文</text>
  <text x="80" y="380" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="19" fill="#8b949e">Screen Studio 工程或普通视频 + 字幕语料</text>
  <text x="80" y="412" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="19" fill="#8b949e">截取真实画面，逐张核对，写成 Markdown 文章</text>

  <!-- flow: video card -->
  <g transform="translate(700, 150)">
    <rect width="230" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="16" y="16" width="198" height="180" rx="10" fill="#0d1117" stroke="#30363d"/>
    <!-- play button -->
    <circle cx="115" cy="106" r="30" fill="url(#accent)"/>
    <path d="M106 92 L130 106 L106 120 Z" fill="#0d1117"/>
    <!-- subtitle lines -->
    <rect x="24" y="216" width="182" height="10" rx="5" fill="#30363d"/>
    <rect x="24" y="238" width="140" height="10" rx="5" fill="#30363d"/>
    <rect x="24" y="260" width="164" height="10" rx="5" fill="#30363d"/>
    <rect x="24" y="282" width="96" height="10" rx="5" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- arrow -->
  <g transform="translate(952, 310)">
    <path d="M0 0 H52 M40 -12 L54 0 L40 12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- flow: article card -->
  <g transform="translate(1024, 118)">
    <rect width="216" height="384" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <!-- article title -->
    <rect x="20" y="24" width="150" height="14" rx="7" fill="#e6edf3"/>
    <rect x="20" y="52" width="176" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="68" width="160" height="8" rx="4" fill="#30363d"/>
    <!-- inline image -->
    <rect x="20" y="92" width="176" height="120" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="66" cy="132" r="12" fill="#f59e0b" opacity="0.8"/>
    <path d="M32 196 L84 148 L118 178 L146 152 L184 196 Z" fill="#30363d"/>
    <!-- more text -->
    <rect x="20" y="232" width="176" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="248" width="150" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="264" width="168" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="292" width="120" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="308" width="176" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="324" width="96" height="8" rx="4" fill="#30363d"/>
    <!-- md badge -->
    <rect x="20" y="346" width="54" height="20" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="47" y="360" font-family="-apple-system, 'Segoe UI', monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">.md</text>
  </g>

  <!-- bottom strip -->
  <text x="80" y="560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="16" fill="#6e7681">agent skill · 搭配 oil-tone 成稿 · 只生成文章和图片，不发布</text>
</svg>
